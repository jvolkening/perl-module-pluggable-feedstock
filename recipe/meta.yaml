{% set name = "perl-module-pluggable" %}
{% set version = "6.4" %}
{% set sha256 = "970fd13accd3d538e637db080ebbd9898020c8b5591837c8493a39edd737922d" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/S/SI/SIMONW/Module-Pluggable-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
    - perl-base
    - perl-data-dumper
    - perl-exporter
    - perl-file-path
    - perl-file-temp
    - perl-pathtools
    - perl-test-simple
  run:
    - perl
    - perl-exporter

test:
  imports:
    - Module::Pluggable
    - Module::Pluggable::Object

about:
  home: https://metacpan.org/dist/Module-Pluggable
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'automatically give your module the ability to have plugins'
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod

extra:
  recipe-maintainers:
     - cbrueffer
